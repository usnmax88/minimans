<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Minimans</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #2f3a2a;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      /* Full screen on a phone; a phone-shaped 9:16 box on a wide screen. */
      #unity-canvas, #loading {
        position: fixed; top: 0; left: 50%; transform: translateX(-50%);
        width: 100vw; height: 100vh; height: 100dvh;
        max-width: 56.25vh; max-width: 56.25dvh;
      }
      #unity-canvas { touch-action: none; outline: none; background: #7fb24f; }
      /* While the game loads: the meadow's green, the name, and a line that fills. */
      #loading {
        background: #7fb24f; pointer-events: none; transition: opacity 0.35s;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        font: 800 34px -apple-system, system-ui, sans-serif; color: #fff; letter-spacing: 0.04em;
        text-shadow: 0 3px 0 rgba(40, 70, 20, 0.55);
      }
      #loading.done { opacity: 0; }
      #loader { width: 62%; height: 14px; border-radius: 99px; background: rgba(40, 70, 20, 0.35); overflow: hidden; }
      #loader .fill { width: 0; height: 100%; border-radius: 99px; background: #fff; transition: width 0.25s ease-out; }
      #loading .error {
        display: none; margin: 0 9%; padding: 8px 12px; border-radius: 8px; background: rgba(43, 46, 51, 0.9);
        font: 600 14px -apple-system, system-ui, sans-serif; text-align: center; text-shadow: none; letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>MINIMANS</div>
      <div id="loader"><div class="fill"></div></div>
      <div class="error"></div>
    </div>
    <script src="Build/4307a914bd14aeaadd290995e6d9ee9a.loader.js"></script>
    <script>
      const loading = document.querySelector("#loading");
      const fill = loading.querySelector(".fill");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/16f1783ea1d061502e2e14e545bc430b.data.unityweb",
        frameworkUrl: "Build/1e493cd5f4623975769b155e58efc28c.framework.js.unityweb",
        codeUrl: "Build/926332dabf783e69f2774a1e44ae7422.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Minimans",
        productVersion: "0.1.0",
        devicePixelRatio: window.devicePixelRatio || 1,  // every pixel the phone has
      }, (progress) => {
        fill.style.width = (progress * 100) + "%";
      }).then(() => {
        fill.style.width = "100%";
        loading.classList.add("done");
        setTimeout(() => loading.remove(), 400);
      }).catch((message) => {
        const error = loading.querySelector(".error");
        error.textContent = message;
        error.style.display = "block";
      });
    </script>
  </body>
</html>
